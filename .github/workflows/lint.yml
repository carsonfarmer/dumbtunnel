name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The first lines, the size budget and shellcheck on the scripts.
      - name: Check the scripts
        run: .regenerate/check.sh static

      - name: shellcheck the tests and dumbertunnel
        run: shellcheck test/*.sh .regenerate/*.sh dumbertunnel
