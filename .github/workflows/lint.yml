name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@v7

      # The runner's own shellcheck is older and flags code that this one allows.
      - name: Install shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" |
            tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >>"$GITHUB_PATH"

      # The first lines, the size budget and shellcheck on the scripts.
      - name: Check the scripts
        run: .regenerate/check.sh static

      - name: shellcheck the tests and dumbertunnel
        run: shellcheck test/*.sh .regenerate/*.sh dumbertunnel
