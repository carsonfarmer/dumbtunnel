name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Uses the n0 relays and DNS to find the laptop, so it needs the network.
      - name: Test
        run: test/run.sh
