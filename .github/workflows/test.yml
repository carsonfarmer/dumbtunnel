name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Spec suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Uses the n0 relays and DNS to find the laptop, so it needs the network.
      - name: Test
        run: .regenerate/check.sh cli relay e2e
